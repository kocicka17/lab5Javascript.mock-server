<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 — Варіант 19</title>
</head>
<body>
    <script>
       
        const API_BASE_URL = "http://localhost/api.php";
        const SURNAME = "starunchak";

       
        class Ship {
            constructor(data) {
                this.id = data.id;
                this.name = data.name;
                this.homePort = data.homePort;
                this.type = data.type;
                this.displacement = data.displacement;
                this.captain = data.captain;
            }

            printToConsole() {
                console.log(`Корабель [ID: ${this.id}]: Назва: "${this.name}", Порт приписки: ${this.homePort}, Тип: ${this.type}, Водотоннажність: ${this.displacement}, Капітан: ${this.captain}`);
            }
        }

        class Port {
            constructor(data) {
                this.id = data.id;
                this.name = data.name;
                this.country = data.country;
                this.dailyFee = data.dailyFee;
                this.category = data.category;
            }

            printToConsole() {
                console.log(`Порт [ID: ${this.id}]: Назва: "${this.name}", Країна: ${this.country}, Ціна дня: ${this.dailyFee}$, Категорія: ${this.category}`);
            }
        }

        class Visit {
            constructor(data) {
                this.id = data.id;
                this.shipId = data.shipId;
                this.portId = data.portId;
                this.berthNumber = data.berthNumber;
                this.purpose = data.purpose;
                this.departureDate = data.departureDate;
                this.arrivalDate = data.arrivalDate;
                this.cargoPurpose = data.cargoPurpose;
                this.customsStatus = data.customsStatus;
            }

            printToConsole() {
                console.log(`Відвідування [ID: ${this.id}]: Корабель ID:${this.shipId} -> Порт ID:${this.portId}, Причал №${this.berthNumber}, Мета: ${this.purpose}, Прибуття: ${this.arrivalDate}, Вибуття: ${this.departureDate}, Вантаж: ${this.cargoPurpose}, Митний статус: ${this.customsStatus}`);
            }
        }

       
        class ApiRepository {
            #baseUrl;
            #type;

            constructor(baseUrl, type) {
                this.#baseUrl = baseUrl;
                this.#type = type;
            }

            getType() {
                return this.#type;
            }

            async readAll() {
                const response = await fetch(`${this.#baseUrl}?type=${this.#type}`);
                if (!response.ok) throw new Error(`Помилка завантаження: ${response.status}`);
                return response.json();
            }

            async readById(id) {
                const response = await fetch(`${this.#baseUrl}?type=${this.#type}&id=${id}`);
                if (!response.ok) throw new Error(`Помилка завантаження: ${response.status}`);
                return response.json();
            }

            async create(item) {
                const response = await fetch(`${this.#baseUrl}?type=${this.#type}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(item),
                });
                if (!response.ok) throw new Error(`Помилка створення: ${response.status}`);
                return response.json();
            }

            async update(id, changes) {
                const response = await fetch(`${this.#baseUrl}?type=${this.#type}&id=${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(changes),
                });
                if (!response.ok) throw new Error(`Помилка оновлення: ${response.status}`);
                return response.json();
            }

            async delete(id) {
                const response = await fetch(`${this.#baseUrl}?type=${this.#type}&id=${id}`, {
                    method: "DELETE",
                });
                if (!response.ok) throw new Error(`Помилка видалення: ${response.status}`);
                return response.json();
            }
        }

       
        async function runLab5() {
            try {
                console.log("  ЛАБОРАТОРНА РОБОТА № 5: REST API + ООП: CRUD через сервер");
                console.log("  Варіант 19 («Судноплавство») | Студент: Старунчак Ольга");

              
                console.log(" ЗАВДАННЯ 2: Створення екземплярів ApiRepository з унікальними значеннями type ");
                const shipRepo  = new ApiRepository(API_BASE_URL, `ship_${SURNAME}`);
                const portRepo  = new ApiRepository(API_BASE_URL, `port_${SURNAME}`);
                const visitRepo = new ApiRepository(API_BASE_URL, `visit_${SURNAME}`);

                console.log("1. Ліва сутність:       ApiRepository -> type:", shipRepo.getType());
                console.log("2. Центральна сутність: ApiRepository -> type:", visitRepo.getType());
                console.log("3. Права сутність:      ApiRepository -> type:", portRepo.getType());
                console.log("Репозиторії успішно ініціалізовано.\n");

               
                console.log(" ЗАВДАННЯ 3: Створення об'єктів методом create() та виведення списків (readAll) у циклі \n");

               
                console.log(" 3.1 Створення кораблів на сервері (POST ?type=ship_starunchak) ");
                const s1Data = await shipRepo.create({ name: "Одеса", homePort: "Одеса", type: "Контейнеровоз", displacement: "45000т", captain: "Петренко В.І." });
                console.log("Створено корабель 1:", s1Data);
                const s2Data = await shipRepo.create({ name: "Чорноморськ", homePort: "Іллічівськ", type: "Танкер", displacement: "60000т", captain: "Коваленко С.М." });
                console.log("Створено корабель 2:", s2Data);
                const s3Data = await shipRepo.create({ name: "Гетьман Сагайдачний", homePort: "Одеса", type: "Фрегат", displacement: "3500т", captain: "Шевченко П.П." });
                console.log("Створено корабель 3:", s3Data);

            
                console.log("\n 3.2 Створення портів на сервері (POST ?type=port_starunchak) ");
                const p1Data = await portRepo.create({ name: "Порт Стамбул", country: "Туреччина", dailyFee: 1200, category: "Міжнародний" });
                console.log("Створено порт 1:", p1Data);
                const p2Data = await portRepo.create({ name: "Порт Пірей", country: "Греція", dailyFee: 1500, category: "Вузловий" });
                console.log("Створено порт 2:", p2Data);
                const p3Data = await portRepo.create({ name: "Порт Констанца", country: "Румунія", dailyFee: 950, category: "Регіональний" });
                console.log("Створено порт 3:", p3Data);

                
                console.log("\n 3.3 Створення відвідувань на сервері (POST ?type=visit_starunchak) ");
                const v1Data = await visitRepo.create({ shipId: s1Data.id, portId: p1Data.id, berthNumber: 12, purpose: "Розвантаження", arrivalDate: "2026-05-10", departureDate: "2026-05-12", cargoPurpose: "Зерно", customsStatus: "Пройдено" });
                console.log("Створено відвідування 1:", v1Data);
                const v2Data = await visitRepo.create({ shipId: s2Data.id, portId: p2Data.id, berthNumber: 5, purpose: "Бункероування", arrivalDate: "2026-06-01", departureDate: "2026-06-03", cargoPurpose: "Паливо", customsStatus: "Очікування" });
                console.log("Створено відвідування 2:", v2Data);
                const v3Data = await visitRepo.create({ shipId: s1Data.id, portId: p2Data.id, berthNumber: 8, purpose: "Технічний огляд", arrivalDate: "2026-07-15", departureDate: "2026-07-18", cargoPurpose: "Обладнання", customsStatus: "Пройдено" });
                console.log("Створено відвідування 3:", v3Data);

               
                console.log("\n 3.4 Читання всіх кораблів (readAll) та виведення в циклі:");
                const allShips = await shipRepo.readAll();
                allShips.forEach(item => new Ship(item).printToConsole());

                console.log("\n 3.5 Читання всіх портів (readAll) та виведення в циклі:");
                const allPorts = await portRepo.readAll();
                allPorts.forEach(item => new Port(item).printToConsole());

                console.log("\n 3.6 Читання всіх відвідувань (readAll) та виведення в циклі:");
                const allVisits = await visitRepo.readAll();
                allVisits.forEach(item => new Visit(item).printToConsole());

             
                console.log(" ЗАВДАННЯ 4: Демонстрація операцій UPDATE та DELETE для кожної сутності");

                
                console.log(" 4.1 Оновлення одного об'єкта кожної сутності (update) ");
                const updatedShip = await shipRepo.update(s1Data.id, { captain: "Петренко В.І. (Головний капітан флоту)" });
                console.log(`Оновлено корабель [ID: ${s1Data.id}]:`, updatedShip);

                const updatedPort = await portRepo.update(p1Data.id, { dailyFee: 1400 });
                console.log(`Оновлено порт [ID: ${p1Data.id}]:`, updatedPort);

                const updatedVisit = await visitRepo.update(v2Data.id, { customsStatus: "Успішно пройдено", purpose: "Повний технічний сервіс" });
                console.log(`Оновлено відвідування [ID: ${v2Data.id}]:`, updatedVisit);

               
                console.log("\n 4.2 Видалення іншого об'єкта кожної сутності (delete) ");
                await shipRepo.delete(s3Data.id);
                console.log(`Корабель [ID: ${s3Data.id}] ("${s3Data.name}") видалено з сервера.`);

                await portRepo.delete(p3Data.id);
                console.log(`Порт [ID: ${p3Data.id}] ("${p3Data.name}") видалено з сервера.`);

                await visitRepo.delete(v3Data.id);
                console.log(`Відвідування [ID: ${v3Data.id}] видалено з сервера.`);

                
                console.log("\n Стан списку відвідувань після операції delete:");
                const remainingVisits = await visitRepo.readAll();
                remainingVisits.forEach(item => new Visit(item).printToConsole());

               
                console.log(" ЗАВДАННЯ 5: Зв'язок 'багато до багатьох' на реальних даних з сервера");
              

                await visitRepo.create({
                    shipId: s1Data.id,
                    portId: p2Data.id,
                    berthNumber: 15,
                    purpose: "Дозавантаження",
                    arrivalDate: "2026-08-20",
                    departureDate: "2026-08-22",
                    cargoPurpose: "Текстиль",
                    customsStatus: "Пройдено"
                });

                const finalShips = await shipRepo.readAll();
                const finalPorts = await portRepo.readAll();
                const finalVisits = await visitRepo.readAll();

                const targetShipId = s1Data.id;
                const shipObj = finalShips.find(s => s.id === targetShipId);
                const visitsForShip = finalVisits.filter(v => v.shipId === targetShipId);

                console.log(`Корабель [ID: ${targetShipId}] "${shipObj ? shipObj.name : 'Одеса'}" відвідав наступні порти:`);
                visitsForShip.forEach((visit, index) => {
                    const portObj = finalPorts.find(p => p.id === visit.portId);
                    console.log(`  ${index + 1}. Порт: "${portObj ? portObj.name : 'ID ' + visit.portId}" (${portObj ? portObj.country : ''}) | Причал №${visit.berthNumber} | Мета: ${visit.purpose} | Вантаж: ${visit.cargoPurpose} | Статус: ${visit.customsStatus}`);
                });

                  

            } catch (error) {
                console.error("ПОМИЛКА:", error.message);
                console.error("Переконайтеся, що сервер Apache + MySQL запущений у XAMPP.");
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runLab5);
        } else {
            runLab5();
        }
    </script>
</body>
</html>
